name: Metro Taxi - Validacion de entrega
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only_password
          POSTGRES_DB: metrotaxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metrotaxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r cloud/requirements.txt
          python -m pip install httpx
      - name: Revision de recursos y JavaScript
        run: python scripts/validar_entrega.py --quick
      - name: Pruebas HTTP y permisos
        run: python -m unittest discover -s tests -v
      - name: Pruebas Cloud API + Netlify staging
        run: python scripts/validar_cloud.py

      - name: Prueba de integración en PostgreSQL temporal de CI
        env:
          METRO_TEST_POSTGRES_URL: postgresql+psycopg://postgres:local_ci_only_password@localhost:5432/metrotaxi_test
        run: python -m unittest tests_cloud.test_postgres_pilot -v
