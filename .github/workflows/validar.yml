name: Metro Taxi - Validacion de entrega
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r cloud/requirements.txt
          python -m pip install httpx
      - name: Revision de recursos y JavaScript
        run: python scripts/validar_entrega.py --quick
      - name: Pruebas HTTP y permisos
        run: python -m unittest discover -s tests -v
      - name: Pruebas Cloud API + Netlify staging
        run: python scripts/validar_cloud.py
