name: Metro Taxi — Demo Pages smoke
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
jobs:
  runtime-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar interfaz sin cargar mapas externos
        run: node tests/demo-smoke.cjs
