plugins { id 'com.android.application' }

def configuredUrl = providers.gradleProperty('metroBaseUrl').orElse('https://example.invalid').get()
if (!(configuredUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
    throw new GradleException('metroBaseUrl debe ser un ORIGEN HTTPS, sin ruta, query, usuario ni fragmento')
}
android {
    namespace 'pa.metrotaxi.conductor'
    compileSdk 35
    defaultConfig {
        applicationId 'pa.metrotaxi.conductor'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.10.0-dev'
        buildConfigField 'String', 'BASE_URL', '"' + configuredUrl + '"'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// El proyecto de demostración nunca debe producir una APK release con URL ficticia.
// Sin servidor HTTPS y pruebas de campo, compilar únicamente debug.
tasks.configureEach { task ->
    if (task.name =~ /(?i).*release.*/ && configuredUrl == 'https://example.invalid') {
        task.doFirst { throw new GradleException('Configura -PmetroBaseUrl=https://TU-SERVIDOR-HTTPS para generar release') }
    }
}
